# pnpm-only config. Other PMs (npm/yarn/bun) ignore this file.
# - strictDepBuilds: false — don't fail install on unapproved build scripts.
# - minimumReleaseAge: 0 — install latest versions even when freshly published.
strictDepBuilds: false
minimumReleaseAge: 0
allowBuilds:
  '@parcel/watcher': set this to true or false
  vue-demi: set this to true or false
